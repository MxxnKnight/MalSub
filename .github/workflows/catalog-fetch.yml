# Daily catalog refresh for MalSUB.
# - 06:00 IST (00:30 UTC)
# - auto mode: full scrape when DB is sparse, else incremental (new entries)
# - Runs on GitHub Actions network (better chance vs Cloudflare than Render)
# - Upserts into the same MongoDB Render uses
#
# Required secret: MONGODB_URI

name: Catalog fetch

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Fetch mode (auto = full first, then incremental)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - incremental

concurrency:
  group: catalog-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Scrape & upsert catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run catalog cron
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_DB_NAME: MALsub
          CATALOG_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: node scripts/catalog-cron.mjs
