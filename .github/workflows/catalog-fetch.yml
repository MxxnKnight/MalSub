# Daily catalog refresh for MalSUB (all three sources in one job).
# - 06:00 IST (00:30 UTC) → auto (full until ~1500 MSone titles, then incremental)
# - Manual run: choose full | incremental | auto
# - Admin UI: Full index / New releases buttons on the live app
#
# Required secret: MONGODB_URI

name: Catalog fetch

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = deep index · incremental = new releases · auto = decide from DB counts"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - incremental

concurrency:
  group: catalog-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Scrape & upsert catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run catalog cron
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_DB_NAME: MALsub
          CATALOG_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: node scripts/catalog-cron.mjs
