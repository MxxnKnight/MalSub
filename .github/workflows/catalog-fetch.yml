# Catalog fetch — lives on default branch (main) so Actions shows "Run workflow".
# Always checks out groku for app scripts + package.json.
# Required secret: MONGODB_URI

name: Catalog fetch

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = deep index · incremental = new releases · auto = from DB counts"
        required: true
        default: full
        type: choice
        options:
          - full
          - incremental
          - auto

concurrency:
  group: catalog-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Scrape & upsert catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout groku (app + cron script)
        uses: actions/checkout@v4
        with:
          ref: groku

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run catalog cron
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_DB_NAME: MALsub
          CATALOG_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: node scripts/catalog-cron.mjs
